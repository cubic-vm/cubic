---
schemaVersion: "1"

project:
  organization: cubic-vm
  name: cubic
  author: Cubic VM team

releases:
  - id: 0.27.1
  - id: 0.27.2

vulnerabilities:

  - id: RUSTSEC-2023-0071
    description: This is a timing attack that could allow an attacker to recover RSA keys from the server.
    releases: []
    packages: ["pkg:cargo/rsa@0.9.10"]
    reports:
      - reporter: cargo-audit
    analysis: The RSA crate is only used for client authentication.
    verdict: not affected
    justification: vulnerable code not in execute path
    comment: "See https://github.com/Eugeny/russh/issues/637"

  - id: RUSTSEC-2026-0382
    description: |-
      Certificate verification may accept chains through distrusted emSign
      intermediates.
    releases: []
    packages: ["pkg:cargo/rustls-webpki@0.103.15"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      Cubic does not ship its own CA store. It verifies certificates against
      the OS CA store, which distributions update to remove the distrusted
      emSign root.
    verdict: not affected
    justification: inline mitigations already exist
    resolution:
      in: 0.27.1
      note: Updated rustls-webpki from 0.103.15 to 0.103.16

  - id: RUSTSEC-2026-0383
    description: |-
      Bundled root certificates allow trust in distrusted emSign
      intermediates.
    releases: []
    packages: ["pkg:cargo/webpki-root-certs@1.0.9"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      The crate is only a dependency of rustls-platform-verifier on the wasm32
      target, which cubic neither supports nor publishes binaries for.
    verdict: not affected
    justification: component not present
    resolution:
      in: 0.27.1
      note: Updated webpki-root-certs from 1.0.9 to 1.0.10

  - id: RUSTSEC-2026-0387
    description: |-
      Operations in crypto-bigint intended to be constant-time could take
      secret-dependent branches and leak secrets through timing side
      channels.
    releases: []
    packages: ["pkg:cargo/crypto-bigint@0.7.5"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      russh uses crypto-bigint for the RSA and elliptic curve operations of
      the SSH client, which handle the client's private keys. An attacker
      able to observe timing on the host could recover secret material.
    verdict: affected
    severity: low
    resolution:
      in: 0.27.1
      note: Updated crypto-bigint from 0.7.5 to 0.7.6

  - id: RUSTSEC-2026-0495
    description: |-
      The russh agent server signs with confirm-constrained keys without
      calling Agent::confirm.
    releases: []
    packages: ["pkg:cargo/russh@0.64.1"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      Cubic uses russh only as an SSH client and never runs the agent
      server.
    verdict: not affected
    justification: vulnerable code not in execute path
    resolution:
      in: 0.27.2
      note: Updated russh from 0.64.1 to 0.65.4

  - id: RUSTSEC-2026-0592
    description: "Url::origin() overflows the stack on deeply nested blob URLs."
    releases: []
    packages: ["pkg:cargo/url@2.5.8"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      Cubic parses only HTTP and HTTPS image URLs through reqwest and never
      handles blob URLs. The worst case is a crash during a download.
    verdict: not affected
    justification: vulnerable code not in execute path
    resolution:
      in: 0.27.2
      note: Updated url from 2.5.8 to 2.5.9

  - id: RUSTSEC-2026-0486
    description: |-
      The rustix xattr functions mark unwritten bytes as initialized when
      given a zero-length buffer.
    releases: []
    packages: ["pkg:cargo/rustix@1.1.5"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      rustix is a dependency of crossterm for terminal handling. Neither
      cubic nor crossterm call the xattr functions.
    verdict: not affected
    justification: vulnerable code not in execute path
    resolution:
      in: 0.27.2
      note: Updated rustix from 1.1.5 to 1.1.6

  - id: RUSTSEC-2026-0543
    description: The chrono crate is unmaintained.
    releases: []
    packages: ["pkg:cargo/chrono@0.4.45"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      chrono is a dependency of russh and russh-sftp. The advisory reports
      no known vulnerability, and cubic can only drop chrono once russh does.
    verdict: not affected
    justification: vulnerable code not present
