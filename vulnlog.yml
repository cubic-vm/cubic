---
schemaVersion: "1"

project:
  organization: cubic-vm
  name: cubic
  author: Cubic VM team

releases:
  - id: 0.27.1

vulnerabilities:

  - id: RUSTSEC-2023-0071
    description: This is a timing attack that could allow an attacker to recover RSA keys from the server.
    releases: []
    packages: ["pkg:cargo/rsa@0.9.10"]
    reports:
      - reporter: cargo-audit
    analysis: The RSA crate is only used for client authentication.
    verdict: not affected
    justification: vulnerable code not in execute path
    comment: "See https://github.com/Eugeny/russh/issues/637"

  - id: RUSTSEC-2026-0382
    description: |-
      Certificate verification may accept chains through distrusted emSign
      intermediates.
    releases: []
    packages: ["pkg:cargo/rustls-webpki@0.103.15"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      Cubic does not ship its own CA store. It verifies certificates against
      the OS CA store, which distributions update to remove the distrusted
      emSign root.
    verdict: not affected
    justification: inline mitigations already exist
    resolution:
      in: 0.27.1
      note: Updated rustls-webpki from 0.103.15 to 0.103.16

  - id: RUSTSEC-2026-0383
    description: |-
      Bundled root certificates allow trust in distrusted emSign
      intermediates.
    releases: []
    packages: ["pkg:cargo/webpki-root-certs@1.0.9"]
    reports:
      - reporter: cargo-audit
    analysis: |-
      The crate is only a dependency of rustls-platform-verifier on the wasm32
      target, which cubic neither supports nor publishes binaries for.
    verdict: not affected
    justification: component not present
    resolution:
      in: 0.27.1
      note: Updated webpki-root-certs from 1.0.9 to 1.0.10
